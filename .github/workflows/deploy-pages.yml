name: Deploy Website to Cloudflare Pages (omnibuf.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install frontend dependencies
        run: just install

      - name: Check formatting & lint
        run: |
          just fmt-check
          just lint

      - name: Build Astro static site
        run: just build

      - name: Deploy to Cloudflare Pages (omnibuf.com)
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          pnpm exec wrangler pages project list | grep -q "omnibuf" || pnpm exec wrangler pages project create omnibuf --production-branch=main
          pnpm exec wrangler pages deploy ./dist --project-name=omnibuf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
